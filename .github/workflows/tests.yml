name: tests

on:
    pull_request:
    push:
        branches:
            - main
            - next-gen

# The unreleased javaabu/* dependencies come from VCS repositories; the job's own
# token keeps Composer within GitHub's API limits
env:
    COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'

jobs:
    pint:
        runs-on: ubuntu-latest

        name: Pint

        steps:
            -   name: Checkout code
                uses: actions/checkout@v5

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: 8.4
                    coverage: none

            -   name: Install dependencies
                run: composer update --prefer-dist --no-interaction --no-progress

            -   name: Check code style
                run: vendor/bin/pint --test

    benchmark:
        runs-on: ubuntu-latest

        name: Benchmark (large import)

        steps:
            -   name: Checkout code
                uses: actions/checkout@v5

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: 8.4
                    extensions: curl, mbstring, zip, pdo, sqlite, pdo_sqlite
                    coverage: none

            -   name: Install dependencies
                run: composer update --prefer-dist --no-interaction --no-progress

            -   name: Import a large file with flat memory
                run: vendor/bin/phpunit --group benchmark

    tests:
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                php: [ 8.4, 8.5 ]
                laravel: [ 12.*, 13.* ]
                stability: [ prefer-lowest, prefer-stable ]
                include:
                    -   laravel: 12.*
                        testbench: 10.*
                    -   laravel: 13.*
                        testbench: 11.*

        name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }}

        env:
            COVERAGE: ${{ matrix.php == '8.4' && matrix.laravel == '13.*' && matrix.stability == 'prefer-stable' }}

        steps:
            -   name: Checkout code
                uses: actions/checkout@v5

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}
                    extensions: curl, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, iconv
                    coverage: ${{ env.COVERAGE == 'true' && 'pcov' || 'none' }}

            -   name: Install dependencies
                run: |
                    composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
                    composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

            -   name: Execute tests
                if: env.COVERAGE != 'true'
                run: vendor/bin/phpunit

            -   name: Execute tests with coverage
                if: env.COVERAGE == 'true'
                run: vendor/bin/phpunit --coverage-clover build/coverage.xml

            -   name: Upload coverage to Codecov
                if: env.COVERAGE == 'true'
                uses: codecov/codecov-action@v5
                with:
                    files: build/coverage.xml
                    fail_ci_if_error: false
                    token: ${{ secrets.CODECOV_TOKEN }}
